/* ---------- table ---------- */
/* `cols` are the column headings; the first is the row-label column and may be
   empty. Each row is [label, cell, cell, …]. Below 720px the headings are
   dropped and each cell carries its column name as a small label. */
function tableEl(t){
  const outer=el('div');
  const w=el('div','tbl');
  const head='<thead><tr>'+t.cols.map(c=>'<th scope="col">'+H(c)+'</th>').join('')+'</tr></thead>';
  const rowHtml=r=>'<tr>'+r.map((cell,i)=>
    i===0 ? '<th scope="row">'+H(cell)+'</th>'
          : '<td data-lbl="'+(t.cols[i]||'')+'">'+H(cell)+'</td>'
  ).join('')+'</tr>';

  /* revealRows: the table starts empty and fills a row at a time */
  if(t.revealRows){
    w.innerHTML='<table>'+head+'<tbody></tbody></table>';
    const body=w.querySelector('tbody');
    const row=el('div'); row.style.margin='0 0 1rem';
    const btn=el('button','btn yellow small', t.revealCta||'Reveal the first row');
    let i=0;
    btn.onclick=()=>{
      body.insertAdjacentHTML('beforeend', rowHtml(t.rows[i])); i++;
      if(i>=t.rows.length) row.remove(); else btn.textContent=t.revealMore||'Reveal the next';
    };
    row.append(btn); outer.append(w,row);
    return outer;
  }

  w.innerHTML='<table>'+head+'<tbody>'+t.rows.map(rowHtml).join('')+'</tbody></table>';
  outer.append(w);
  return outer;
}

/* ---------- branching conversation ---------- */
/* Runs a scenario as a state machine. Each node contributes its own lines to a
   running transcript, then offers a choice; every option names the node it
   leads to, so learners on different paths see different conversations. Nodes
   without options are scripted beats that continue to `next`; nodes with
   `done` end the scenario. Only the path taken is shown.
   An option marked `deferFb` holds its node's feedback back until after the
   beat it leads to, so a recovery exchange plays before the teaching point. */
function convoEl(cfg){
  const wrap=el('div');
  const stream=el('div');
  const foot=el('div');
  wrap.append(stream, foot);
  const isText = cfg.ch==='Text';
  let said=false, pending=null;

  /* Voice scenarios stay audio-first: each exchange gets its own placeholder,
     with the transcript collapsed unless the scenario asks for it open. */
  const turnEl=(lines,label)=>{
    const th=threadEl({ch:cfg.ch, noCh:said||cfg.audio, lines});
    if(!cfg.audio) return th;
    return audioEl({label:label||'The call continues', open:cfg.transcripts==='open', transcript:th});
  };

  const fbEl=(src)=>{
    if(!src || (!src.fb && !src.fbBlocks)) return;
    const fb=el('div','fb info'); fb.setAttribute('role','status');
    if(src.fb) fb.append(el('p',null,H(src.fb)));
    if(src.fbBlocks) blocks(src.fbBlocks, fb);
    stream.append(fb);
  };

  const runNode=(id)=>{
    const n=cfg.nodes[id];
    if(!n) return;
    if(n.blocks) blocks(n.blocks, stream);
    if(n.lines && n.lines.length){ stream.append(turnEl(n.lines, n.audioLabel)); said=true; }
    if(pending){ fbEl(pending); pending=null; }

    if(n.done){
      if(cfg.restart){
        const again=el('button','btn ghost small', cfg.restart);
        again.onclick=()=>{ stream.innerHTML=''; foot.innerHTML=''; said=false; pending=null; runNode(cfg.start); };
        foot.innerHTML=''; foot.append(again);
      }
      return;
    }

    if(!n.options){
      const on=el('button','btn yellow small', n.cta||'Continue the call');
      on.style.margin='0 0 1rem';
      on.onclick=()=>{ on.remove(); runNode(n.next); };
      stream.append(on);
      return;
    }

    const q=el('div','check','<p class="prompt">'+H(n.prompt)+'</p>'+
      (n.hint?'<p class="hint">'+H(n.hint)+'</p>':''));
    const list=el('div','opts'); q.append(list);
    stream.append(q);

    n.options.forEach(o=>{
      const b=el('button','opt','<span class="key">'+o.k+'</span><span>'+H(o.t)+'</span>');
      b.onclick=()=>{
        list.querySelectorAll('button').forEach(x=>{
          x.disabled=true;
          if(x!==b) x.dataset.outcome='dim';
        });
        b.dataset.picked='1';
        const turn=[{who:'us', spk:'Responder', t:o.t.replace(/^"|"$/g,'')}]
          .concat((o.reply||[]).map(r=>({...r, who:'them'})));
        stream.append(turnEl(turn, cfg.audioLabel||'Your response and what follows'));
        said=true;
        if(o.deferFb) pending={fb:n.fb, fbBlocks:n.fbBlocks};
        else fbEl(n);
        const on=el('button','btn yellow small', o.cta||'Continue the call');
        on.style.margin='.9rem 0 1rem';
        on.onclick=()=>{ on.remove(); runNode(o.next); };
        stream.append(on);
      };
      list.append(b);
    });
  };

  runNode(cfg.start);
  return wrap;
}

/* ---------- response step ---------- */
/* One "choose what you would say" step: options, the reply each one draws,
   and a shared closing note once a response has been chosen. Used on its own
   (`respond` screens) and as step 2 of a vignette. */
function respondEl(cfg, isText){
  const wrap=el('div');
  const q=el('div','check','<p class="prompt">'+H(cfg.prompt)+'</p>'+
    (cfg.hint?'<p class="hint">'+H(cfg.hint)+'</p>':''));
  const list=el('div','opts'); q.append(list);
  const out=el('div'), closing=el('div');
  let chosen=null, tried=[];
  const paint=()=>{
    list.innerHTML=''; out.innerHTML=''; closing.innerHTML='';
    cfg.options.filter(o=>!chosen||o.k===chosen).forEach(o=>{
      const b=el('button','opt','<span class="key">'+o.k+'</span><span>'+H(o.t)+'</span>');
      if(chosen){ b.disabled=true; b.dataset.picked='1'; }
      b.onclick=()=>{ chosen=o.k; tried.push(o.k); paint(); };
      list.append(b);
    });
    if(chosen){
      const o=cfg.options.find(x=>x.k===chosen);
      const cont=el('div','thread','<p class="ch">'+(isText?'How the thread continues':'How the call continues')+'</p>');
      cont.append(lineEl({who:'us',spk:'Responder',t:o.t.replace(/^"|"$/g,'')},isText));
      o.reply.forEach(r=>cont.append(lineEl({...r,who:'them'},isText)));
      if(isText) out.append(cont);
      else out.append(audioEl({label:cfg.audioLabel||'Your response and what follows', transcript:cont}));
      if(tried.length<cfg.options.length){
        const again=el('button','btn yellow small', cfg.againLabel||'Try another response');
        again.style.margin='0 0 1rem'; again.onclick=()=>{ chosen=null; paint(); };
        out.append(again);
      }
      const fb=el('div','fb info'); fb.setAttribute('role','status');
      /* Where the learner drafted a response first, it is set beside the
         strongest option before the closing note. */
      if(cfg.compare){
        const best=cfg.options.find(x=>x.k===cfg.compare.best);
        const mine=(cfg.compare.store.text||'').trim();
        const cmp=el('div','compare',
          '<div class="side"><span class="lbl">What you wrote</span>'+
          (mine ? '<p>'+ESC(mine)+'</p>' : '<p class="none">You moved on without writing a response.</p>')+'</div>'+
          '<div class="side best"><span class="lbl">The strongest response</span><p>'+H(best.t.replace(/^"|"$/g,''))+'</p></div>');
        fb.append(cmp);
      }
      if(cfg.closing) fb.append(el('p',null,H(cfg.closing)));
      if(cfg.closingBlocks) blocks(cfg.closingBlocks, fb);
      closing.append(fb);
      if(cfg.onChoose) cfg.onChoose(chosen);
    }
  };
  paint();
  wrap.append(q,out,closing);
  return wrap;
}

/* ---------- knowledge check ---------- */
function questionEl(q, opts){
  const box=el('div','check',
    '<p class="prompt'+(q.ask?' scenario':'')+'">'+H(q.prompt)+'</p>'+
    (q.ask?'<p class="prompt ask">'+H(q.ask)+'</p>':'')+
    (q.hint?'<p class="hint">'+H(q.hint)+'</p>':''));
  const list=el('div','opts'); box.append(list);
  const slot=el('div'); box.append(slot);
  /* `picked` is the answer given; `reading` is another option the learner has
     opened afterwards to read its feedback, which questions with per-option
     feedback allow once the right answer is in. */
  let picked=null, reading=null;
  const perOption = !q.shared && !q.oneFb;
  const paint=()=>{
    list.innerHTML=''; slot.innerHTML='';
    const gotIt = picked && (q.shared || (q.options.find(o=>o.k===picked)||{}).correct);
    const open = perOption && gotIt;
    q.options.forEach(o=>{
      const b=el('button','opt','<span class="key">'+o.k+'</span><span>'+H(o.t)+'</span>');
      if(picked){
        b.disabled = !open;
        if(picked===o.k) b.dataset.picked='1';
        if(q.shared){ if(q.answerKey===o.k) b.dataset.outcome='info'; else if(picked!==o.k) b.dataset.outcome='dim'; }
        else if(q.oneFb){
          if(o.correct) b.dataset.outcome='correct';
          else if(picked===o.k) b.dataset.outcome='wrong';
          else b.dataset.outcome='dim';
        }
        else if(open){ if(o.correct) b.dataset.outcome='correct'; else if(reading===o.k) b.dataset.outcome='info'; }
        else if(gotIt){ if(o.correct) b.dataset.outcome='correct'; else b.dataset.outcome='dim'; }
      }
      b.onclick=()=>{
        if(open){ reading = (o.k===picked||o.k===reading) ? null : o.k; paint(); return; }
        picked=o.k; reading=null; paint();
        if(opts&&opts.onPick) opts.onPick(o.k);
        if(opts&&opts.onCorrect&&(q.shared||o.correct)) opts.onCorrect();
      };
      list.append(b);
    });
    if(picked){
      const shown=q.options.find(o=>o.k===(reading||picked));
      const fb=el('div'); fb.setAttribute('role','status');
      if(q.shared){ fb.className='fb info'; fb.innerHTML='<p>'+H(q.sharedFb)+'</p>'; }
      else if(q.oneFb){ fb.className='fb '+(shown.correct?'yes':'no'); fb.innerHTML='<p>'+H(q.oneFb)+'</p>'; }
      else{
        fb.className='fb '+(reading ? 'info' : (shown.correct?'yes':'no'));
        fb.innerHTML='<p>'+H(shown.fb)+'</p>';
        if(!shown.correct && !reading){
          const again=el('button','btn ghost small','Try again'); again.style.marginTop='.8rem';
          again.onclick=()=>{ picked=null; reading=null; paint(); };
          fb.append(again);
        }
      }
      slot.append(fb);
    }
  };
  paint();
  return box;
}

/* ---------- pages ---------- */
const stream=$('#stream'), hero=document.querySelector('.hero');
const PAGES = SECTIONS.map((entry,si)=>({
  si,
  name: (typeof entry==='string') ? entry : entry.name,
  /* Continuation pages carry `menu:false` so the contents list stays an
     outline of topics and activities rather than every page. */
  menu: (typeof entry==='string') ? true : entry.menu!==false,
  header: SCREENS.find(s=>s.sec===si && s.type==='section') || null,
  chunks: SCREENS.filter(s=>s.sec===si && s.type!=='section' && s.type!=='cover' && s.type!=='complete')
}));
const TOTAL = PAGES.reduce((n,p)=>n+p.chunks.length,0);
const state = { page:0, revealed: PAGES.map(()=>1), done:false, picks:{} };

function el2(tag,cls,html){ return el(tag,cls,html); }
let writeSeq=0;

function dividerEl(s){
  const d=el('section','divider rev in');
  d.dataset.tone=s.tone||'trust';
  d.innerHTML='<div class="in"><div>'+(s.num?'<p class="num">'+s.num+'</p>':'<div class="rule"></div>')+
    '<p class="kick">'+s.kicker+'</p><h2>'+H(s.title)+'</h2><p class="line">'+H(s.line)+'</p></div>'+
    '<div>'+sectionArt(s.art,s.tone)+'</div></div>';
  return d;
}

function chunkEl(s){
  const d=el('div','blk rev'); const c=el('div','col'); d.append(c);
  if(s.eyebrow) c.append(el('p','eyebrow',s.eyebrow));
  if(s.title) c.append(el('h2',null,H(s.title)));

  if(s.type==='prose'){ blocks(s.blocks,c); return d; }

  if(s.type==='mcq'){
    if(s.intro) blocks(s.intro,c);
    c.append(questionEl(s, s.id ? {onPick:k=>{ state.picks[s.id]=k; }} : undefined));
    return d;
  }

  if(s.type==='vignette'){
    const isText=s.thread.ch==='Text';
    const v=el('div','vig');
    v.append(el('div','vig-head','<div class="avatar">'+s.person.init+'</div>'+
      '<div><span class="nm">'+s.person.name+'</span><span class="sub">'+s.person.sub+'</span></div>'+
      '<span class="chip'+(isText?' blue':'')+'" style="display:none">'+s.person.tag+'</span>'));
    if(isText) v.append(threadEl(s.thread));
    else v.append(audioEl({label:'Opening moments of the call', transcript:threadEl(s.thread)}));

    /* A vignette runs the steps the storyboard gives it: a question about what
       the person needs, a draft of the learner's own first response, and the
       response choice. Steps are numbered only where there is more than one,
       and each one unlocks the next. The presentation tag stays hidden until a
       step has been answered, so it does not give the answer away. */
    const store={text:''};
    const parts=[];
    if(s.step1) parts.push('need');
    if(s.write)  parts.push('write');
    parts.push('respond');
    const labels={need:'What may '+s.person.name+' need first?',
                  write:'Write your own first response',
                  respond:'Choose your first response'};
    const showTag=()=>{ v.querySelector('.chip').style.display=''; };
    const boxes=parts.map((p,i)=>{
      const b=el('div', i>0 ? 'locked' : null);
      if(parts.length>1) b.append(el('p','step','<span class="n">'+(i+1)+'</span> '+labels[p]));
      return b;
    });
    const unlock=i=>{ if(boxes[i]) boxes[i].classList.remove('locked'); };
    parts.forEach((p,i)=>{
      if(p==='need'){
        boxes[i].append(questionEl({prompt:s.step1.prompt, hint:s.step1.hint, options:s.step1.options},
          {onCorrect:()=>{ unlock(i+1); showTag(); }}));
      } else if(p==='write'){
        boxes[i].append(writeStepEl(s.write, store, ()=>unlock(i+1)));
      } else {
        boxes[i].append(respondEl({...s.step2,
          compare: s.write ? {store, best:s.write.best} : null,
          onChoose: s.step1 ? null : showTag}, isText));
      }
    });
    boxes.forEach(b=>v.append(b));
    c.append(v);
    return d;
  }

  if(s.type==='convo'){
    if(s.intro) blocks(s.intro,c);
    c.append(convoEl(s));
    return d;
  }

  if(s.type==='respond'){
    if(s.intro) blocks(s.intro,c);
    c.append(respondEl(s, s.ch==='Text'));
    return d;
  }

  if(s.type==='write'){
    if(s.intro) blocks(s.intro,c);
    c.append(writingEl({id:'w'+(writeSeq++), prompts:s.prompts, numbered:!!s.numbered,
      placeholder:s.placeholder||'Your answer', cta:s.cta||'Submit',
      feedbackBlocks:s.feedback, prototypeNote:s.prototypeNote, after:s.after, plainFeedback:s.plainFeedback,
      onShow: s.annotate ? ()=>c.querySelectorAll('.ann').forEach(a=>a.classList.add('on')) : null}));
    return d;
  }

  if(s.type==='video'){
    blocks(VIDEO_BLOCKS,c);
    c.append(el('div','video','<div class="frame"><span class="play"></span><span class="lbl">Responder voices &middot; video to be produced</span></div>'));
    return d;
  }

  if(s.type==='reflect'){
    blocks(REFLECT_INTRO,c);
    c.append(writingEl({id:'r', prompts:REFLECT_PROMPTS, numbered:true, cta:'Submit my reflection',
      feedback:'<p>'+H(REFLECT_FEEDBACK)+'</p>'}));
    return d;
  }

  if(s.type==='plan'){
    blocks(PLAN_INTRO,c);
    c.append(writingEl({id:'p', prompts:PLAN_PROMPTS, numbered:false, placeholder:'What would work for you?',
      cta:'Submit my plan',
      feedback:'<p>'+H(PLAN_FEEDBACK)+'</p>'+
        cardsEl({cols:1, tight:true, items:STRATEGIES.map(t=>({t}))}).outerHTML}));
    return d;
  }

  if(s.type==='refs'){ c.append(el('div','refs', REFS.map(r=>'<p>'+r+'</p>').join(''))); return d; }
  return d;
}

function endEl(){
  return el('section','end rev','<div class="sweep"></div><div class="in">'+
    '<p class="eyebrow">'+META.moduleLabel+' complete</p><h2>'+H(END.title)+'</h2>'+
    '<p>'+H(END.summary)+'</p>'+
    '<div class="panel"><h4>'+H(END.nextTitle)+'</h4><p>'+H(END.next)+'</p></div>'+
    '</div>');
}

function gateEl(){
  const p=PAGES[state.page], shown=state.revealed[state.page];
  const g=el('div','gate');
  const more = shown < p.chunks.length;
  const last = state.page===PAGES.length-1;
  const btn=el('button','btn', more ? 'Continue' : (last ? 'Finish module' : 'Continue to '+PAGES[state.page+1].name));
  btn.onclick=()=>{
    if(more){
      g.remove();
      const node=chunkEl(p.chunks[shown]);
      stream.append(node);
      state.revealed[state.page]=shown+1;
      stream.append(gateEl());
      requestAnimationFrame(()=>{ node.classList.add('in'); node.scrollIntoView({behavior:'smooth',block:'start'}); });
      progress();
    } else if(last){
      g.remove(); state.done=true;
      const e=endEl(); stream.append(e);
      requestAnimationFrame(()=>{ e.classList.add('in'); e.scrollIntoView({behavior:'smooth',block:'start'}); });
      progress();
    } else {
      goPage(state.page+1);
    }
  };
  g.append(btn);
  if(state.page>0 && !more){
    const back=el('button','back','Back to '+PAGES[state.page-1].name);
    back.onclick=()=>goPage(state.page-1);
    g.append(back);
  }
  return g;
}

function goPage(pi){
  state.page=pi;
  stream.innerHTML='';
  hero.style.display = pi===0 ? '' : 'none';
  const p=PAGES[pi];
  stream.dataset.top = p.header ? 'divider' : (pi===0 ? 'hero' : 'bare');
  if(p.header) stream.append(dividerEl(p.header));
  const shown=state.revealed[pi];
  for(let i=0;i<shown;i++){ const n=chunkEl(p.chunks[i]); n.classList.add('in'); stream.append(n); }
  stream.append(gateEl());
  if(state.done && pi===PAGES.length-1){ const e=endEl(); e.classList.add('in'); stream.append(e); }
  window.scrollTo({top: pi===0 ? 0 : 0, behavior:'auto'});
  buildToc(); progress();
}

/* ---------- contents drawer ---------- */
const toc=$('#toc');
function buildToc(){
  toc.innerHTML='';
  let n=0;
  PAGES.forEach((p,si)=>{
    if(!p.menu) return;
    /* a hidden continuation page counts as still being inside its listed page */
    let last=si; while(last+1<PAGES.length && !PAGES[last+1].menu) last++;
    const complete = state.revealed[last] >= PAGES[last].chunks.length && last < state.page;
    const here = state.page>=si && state.page<=last;
    if(si>0) n++;
    const a=el('a',null,'<span class="n">'+(si===0?'Start':'Part '+n)+(complete?'<span class="tick">&#9679;</span>':'')+'</span>'+p.name);
    a.href='#';
    if(here) a.setAttribute('aria-current','true');
    a.onclick=e=>{ e.preventDefault(); goPage(si); closeDrawer(); };
    toc.append(a);
  });
}
const drawer=$('#drawer'), menubtn=$('#menubtn');
function openDrawer(){ drawer.classList.add('on'); menubtn.setAttribute('aria-expanded','true'); }
function closeDrawer(){ drawer.classList.remove('on'); menubtn.setAttribute('aria-expanded','false'); }
menubtn.onclick=()=>drawer.classList.contains('on')?closeDrawer():openDrawer();
drawer.onclick=e=>{ if(e.target===drawer) closeDrawer(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });
$('#begin').onclick=()=>stream.scrollIntoView({behavior:'smooth',block:'start'});

/* ---------- progress ---------- */
const fill=$('#fill'), pct=$('#pct');
function progress(){
  let seen=0;
  PAGES.forEach((p,i)=>{ seen += (i<state.page) ? p.chunks.length : (i===state.page ? state.revealed[i] : 0); });
  const p=Math.min(100, Math.round(seen/TOTAL*100));
  fill.style.width=p+'%'; pct.textContent=p+'%';
}

goPage(0);
</script>
