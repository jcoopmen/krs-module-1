<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key Responder Skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
html{font-size:clamp(16px,0.42vw + 13.4px,24px)}
@media (max-width:760px){html{font-size:17px}}
:root{
  --trust:#FDDA64; --tranquil:#B8D8EB; --team:#235B4E; --taupe:#847770;
  --header:#222222; --body:#424759; --bg:#F0F2F5; --border:#D8DEEB; --white:#fff;
  --convo:#F1F8FC; --convo-line:#D3E7F3; --alert:#C0392B; --alert-bg:#FBEDEB;
  --sans:"Roboto","Helvetica Neue",Arial,sans-serif;
  --serif:"Lora",Georgia,"Times New Roman",serif;
  --col:46rem;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;scroll-behavior:smooth}
body{font-family:var(--serif);color:var(--body);background:var(--white);font-size:1.06rem;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.sans{font-family:var(--sans);color:var(--header);font-weight:500}
button{font:inherit}
:focus-visible{outline:2px solid var(--team);outline-offset:2px;border-radius:99px}
.skip{position:absolute;left:-9999px;background:var(--header);color:#fff;padding:10px 16px;z-index:200}
.skip:focus{left:0;top:0}

/* ---------- logo ---------- */
.lockup{display:flex;align-items:center;gap:.7rem}
.mark{background:var(--trust);color:var(--header);border-radius:50%;font-family:var(--sans);font-weight:700;display:grid;place-items:center;flex:0 0 auto;letter-spacing:-.02em}
.mark.lg{width:5rem;height:5rem;font-size:1.5rem}
.mark.md{width:2.5rem;height:2.5rem;font-size:.78rem}
.wordmark{font-family:var(--sans);font-weight:700;color:var(--header);line-height:1.12}
.wordmark.lg{font-size:1.5rem}
.wordmark.md{font-size:.8rem}

/* ---------- top bar ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.top .row{max-width:78rem;margin:0 auto;padding:.6rem 1.4rem;display:flex;align-items:center;gap:1rem}
.top .name{font-family:var(--sans);font-size:.82rem;color:var(--taupe);letter-spacing:.02em;line-height:1.3}
.top .name b{display:block;color:var(--header);font-weight:500;font-size:.95rem}
.top .spacer{flex:1}
.menu{font-family:var(--sans);font-size:.85rem;background:none;border:1.5px solid var(--border);border-radius:99px;padding:.42rem 1rem;cursor:pointer;color:var(--header);display:flex;align-items:center;gap:.5rem}
.menu:hover{border-color:var(--trust)}
.menu .bars{display:inline-flex;flex-direction:column;gap:3px}
.menu .bars i{width:14px;height:2px;background:var(--header);border-radius:2px}
.track{height:3px;background:var(--bg)}
.fill{height:100%;width:0;background:var(--trust);transition:width .12s linear}

.drawer{position:fixed;inset:0;z-index:99;background:rgba(34,34,34,.35);opacity:0;pointer-events:none;transition:opacity .25s}
.drawer.on{opacity:1;pointer-events:auto}
.drawer .panel2{position:absolute;right:0;top:0;bottom:0;width:min(23rem,88vw);background:var(--white);padding:5rem 1.6rem 2rem;overflow-y:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.drawer.on .panel2{transform:none}
.drawer h4{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);margin:0 0 .8rem}
.drawer a{display:block;font-family:var(--sans);font-size:.95rem;color:var(--body);text-decoration:none;padding:.6rem .8rem;border-radius:.7rem;line-height:1.35}
.drawer a:hover{background:var(--bg);color:var(--header)}
.drawer a .n{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--taupe)}

/* ---------- hero ---------- */
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:7rem 1.4rem 9rem;position:relative;overflow:hidden}
.hero .in{max-width:var(--col);margin:0 auto;width:100%;position:relative;z-index:1}
.hero .sweep{position:absolute;left:-10%;right:-10%;bottom:-6rem;height:18rem;background:var(--trust);border-radius:100% 100% 0 0 / 100% 100% 0 0}
.hero .circ{position:absolute;right:-3rem;bottom:0;width:15rem;height:15rem;border-radius:50%;background:var(--tranquil)}
.hero .lockup{margin-bottom:2.6rem}
.hero .kick{font-family:var(--sans);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--taupe);margin:0 0 .7rem}
.hero h1{font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.1;margin:0 0 .6rem;letter-spacing:-.5px}
.hero .sub{font-family:var(--sans);font-size:1.15rem;color:var(--header);margin:0 0 1.4rem}
.hero .meta{font-family:var(--sans);font-size:.85rem;color:var(--taupe);margin:0 0 2rem}
.scrollcue{display:inline-flex;align-items:center;gap:.7rem;background:var(--header);color:#fff;border:0;border-radius:99px;padding:.75rem 1.6rem;font-family:var(--serif);font-size:1rem;cursor:pointer}
.scrollcue:hover{transform:translateY(-1px)}

/* ---------- stream ---------- */
main{padding-bottom:6rem}
.col{max-width:var(--col);margin:0 auto;padding:0 1.4rem}
.blk{margin:0 auto;padding:2.2rem 0 0;scroll-margin-top:5rem}
/* A page opening with a divider clears the fixed bar on its own margin. A
   continuation page starts straight into a screen, so it needs the room. */
#stream[data-top="bare"]>.blk:first-child{padding-top:5.6rem}
.rev{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
.rev.in{opacity:1;transform:none}
p{margin:0 0 1rem}
h2{font-size:1.9rem;line-height:1.2;margin:0 0 .9rem;letter-spacing:-.3px}
h3{font-size:1.15rem;margin:1.6rem 0 .6rem}
.eyebrow{font-family:var(--sans);font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--taupe);margin:0 0 .5rem}
strong{font-weight:600;color:var(--header)}
ul.brand,ol.brand{margin:0 0 1rem;padding:0;list-style:none}
ul.brand li{position:relative;padding-left:1.5rem;margin-bottom:.55rem}
ul.brand li::before{content:"";position:absolute;left:.15rem;top:.72em;width:.5rem;height:.5rem;border-radius:50%;background:var(--trust)}
ol.brand{counter-reset:b}
ol.brand li{position:relative;padding-left:2.6rem;margin-bottom:.8rem;counter-increment:b}
ol.brand li::before{content:counter(b);position:absolute;left:0;top:0;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--trust);color:var(--header);font-family:var(--sans);font-weight:500;font-size:.85rem;display:grid;place-items:center}

.panel{background:var(--bg);border:1px solid var(--border);border-radius:1.2rem;padding:1.1rem 1.35rem;margin:0 0 1rem;position:relative;overflow:hidden}
.panel.blue{background:#EAF4FA;border-color:#CFE5F2}
.panel.blue::after{content:"";position:absolute;right:-2rem;top:-2.6rem;width:6rem;height:6rem;border-radius:50%;background:rgba(255,255,255,.55)}
.panel h4{margin:0 0 .35rem;font-size:1rem}
.panel p{margin:0;position:relative;z-index:1}
.note{font-style:italic;border-left:3px solid var(--taupe);padding:.15rem 0 .15rem 1rem;margin:0 0 1rem}
.note p{margin:0}
.keycall{border-left:.3rem solid var(--trust);background:var(--bg);border-radius:0 1rem 1rem 0;padding:1rem 1.3rem;margin:.4rem 0 1rem}
.keycall p{margin:0 0 .5rem;color:var(--header);font-family:var(--sans);font-size:1.02rem;line-height:1.5}
.keycall p:last-child{margin:0}

.cards{display:grid;gap:.7rem;margin:0 0 1rem}
.cards[data-cols="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.cards[data-cols="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.cards[data-cols="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
.cards[data-cols="5"]{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{background:var(--bg);border:1px solid var(--border);border-radius:1.1rem;padding:.85rem .95rem;display:flex;gap:.7rem;align-items:flex-start;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-2px);border-color:var(--trust)}
/* The lift on hover moves the bottom edge away from the pointer; this keeps
   the hover area where it was so a card at the edge does not flicker. */
.card{position:relative}.card::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px}
.card span{font-size:.97rem;line-height:1.5;min-width:0;overflow-wrap:anywhere}
.card .mk{flex:0 0 auto;font-family:var(--sans);font-size:.8rem;font-weight:500;color:var(--taupe);padding-top:.12rem}
.card .mk.dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--trust);margin-top:.6rem}
.cards.numbered .card{align-items:center}
.cards.tight .card{padding:.6rem .8rem}

.flips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin:.4rem 0 1rem}
.flips[data-cols="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.flip{perspective:1000px;min-height:15rem;display:grid}
.flip .inner{position:relative;width:100%;display:grid;transition:transform .55s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;cursor:pointer;background:none;border:0;padding:0;text-align:left;font:inherit}
.flip.on .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;min-height:15rem;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:1.2rem;padding:1.2rem 1.15rem;display:flex;flex-direction:column;justify-content:space-between;gap:.7rem;overflow:hidden}
.face .n{font-family:var(--sans);font-weight:500;font-size:1.2rem;color:var(--header);opacity:.45;line-height:1}
.face .t{font-family:var(--sans);font-weight:500;font-size:1.05rem;color:var(--header);line-height:1.3;margin-top:auto}
.face .hint{font-family:var(--sans);font-size:.66rem;letter-spacing:.11em;text-transform:uppercase;color:var(--header);opacity:.55;line-height:1.3}
.face.f{background:var(--trust)}
.face.b{background:var(--bg);border:1px solid var(--border);transform:rotateY(180deg)}
.face.b p{font-size:.95rem;line-height:1.55;margin:0 0 auto}
.face.b .hint{opacity:.75}
.flip .inner:hover .face.f{filter:brightness(1.03)}

.tabs{margin:0 0 1rem}
.tablist{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem}
.tablist button{font-family:var(--sans);font-size:.85rem;border:1.5px solid var(--border);background:var(--white);color:var(--body);border-radius:99px;padding:.42rem 1rem;cursor:pointer}
.tablist button[aria-selected="true"]{background:var(--trust);border-color:var(--trust);color:var(--header);font-weight:500}
.tabpanel{background:var(--bg);border:1px solid var(--border);border-radius:1.2rem;padding:1.1rem 1.35rem}
.tabpanel h4{margin:0 0 .35rem;font-size:1rem}
.tabpanel p{margin:0}

.acc{border-top:1px solid var(--border);margin:0 0 1rem}
.acc-item{border-bottom:1px solid var(--border)}
.acc-item>button{width:100%;display:flex;gap:.8rem;align-items:center;background:none;border:0;cursor:pointer;padding:.85rem .2rem;text-align:left;font-family:var(--sans);font-size:1rem;color:var(--header);font-weight:500;line-height:1.35}
.acc-item>button .plus{margin-left:auto;flex:0 0 auto;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--trust);display:grid;place-items:center;position:relative;transition:transform .25s}
.acc-item>button .plus::before,.acc-item>button .plus::after{content:"";position:absolute;background:var(--header);border-radius:2px}
.acc-item>button .plus::before{width:.62rem;height:2px}
.acc-item>button .plus::after{width:2px;height:.62rem;transition:opacity .2s}
.acc-item.on>button .plus{transform:rotate(180deg)}
.acc-item.on>button .plus::after{opacity:0}
.acc-body{display:none;padding:0 2.4rem .9rem .2rem}
.acc-item.on .acc-body{display:block}
.acc-body p{margin:0;font-size:.98rem}
.acc-body li{font-size:.98rem}
.acc-body>:last-child{margin-bottom:0}

.reveal-list{display:flex;flex-direction:column;gap:.5rem;margin:0 0 .8rem}
.rv{display:flex;gap:.7rem;align-items:flex-start;background:var(--bg);border:1px solid var(--border);border-radius:1rem;padding:.7rem .95rem}
.rv .d{width:.5rem;height:.5rem;border-radius:50%;background:var(--trust);flex:0 0 auto;margin-top:.6rem}
.rv span{font-size:.97rem;line-height:1.5}
.btn{font-family:var(--serif);font-size:1rem;border-radius:99px;padding:.6rem 1.5rem;border:1.5px solid transparent;cursor:pointer;background:var(--header);color:#fff}
.btn:hover{transform:translateY(-1px)}
.btn{position:relative}.btn::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px}
.btn.ghost{background:var(--white);color:var(--header);border-color:var(--border)}
.btn.ghost:hover{border-color:var(--header);background:var(--white)}
.fb.no .btn.ghost{border-color:#E4B7B1}
.fb.no .btn.ghost:hover{border-color:var(--alert);color:var(--alert)}
.fb.no :focus-visible{outline-color:var(--alert)}
.btn.yellow{background:var(--trust);color:var(--header)}
.btn.small{font-size:.88rem;padding:.5rem 1.15rem}

/* ---------- section divider ---------- */
.divider{margin:4.5rem 0 1rem;padding:3.2rem 1.4rem;border-top:1px solid var(--border);border-bottom:.5rem solid var(--trust);background:var(--white);scroll-margin-top:4.5rem}
.divider[data-tone="tranquil"]{border-bottom-color:var(--tranquil)}
.divider .in{max-width:var(--col);margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 9.5rem;gap:2rem;align-items:center}
.divider .num{font-family:var(--sans);font-weight:500;font-size:3.8rem;line-height:1;color:var(--trust);margin:0 0 .1rem}
.divider[data-tone="tranquil"] .num{color:var(--tranquil)}
.divider .rule{width:3.2rem;height:.32rem;border-radius:99px;background:var(--trust);margin:0 0 .9rem}
.divider[data-tone="tranquil"] .rule{background:var(--tranquil)}
.divider .kick{font-family:var(--sans);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--taupe);margin:0 0 .4rem}
.divider h2{font-size:2.3rem;margin:0 0 .6rem}
.divider .line{margin:0;max-width:40ch}
.divider .art{width:100%;height:auto}

/* ---------- table ---------- */
.tbl{margin:1rem 0;border:1px solid var(--border);border-radius:1.1rem;overflow:hidden}
.tbl table{width:100%;border-collapse:collapse}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:.75rem .9rem;font-size:.96rem;line-height:1.5;border-bottom:1px solid var(--border)}
.tbl tbody:empty{display:none}
.tbl thead th{font-family:var(--sans);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--taupe);font-weight:500;background:var(--bg)}
.tbl tbody th{font-family:var(--sans);font-weight:500;color:var(--header);font-size:1rem}
.tbl tbody tr:last-child th,.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:nth-child(even) th,.tbl tbody tr:nth-child(even) td{background:#FBFBFD}

/* ---------- knowledge check ---------- */
.check{background:#F7F8FB;border:1px solid var(--border);border-radius:1.4rem;padding:1.4rem 1.5rem;margin:1rem 0}
.check .hint{font-family:var(--serif);font-style:italic;color:var(--taupe);font-size:.98rem;margin:-.4rem 0 .9rem}
.check .prompt{font-family:var(--sans);font-size:1.1rem;color:var(--header);font-weight:500;margin:0 0 .9rem;line-height:1.4}
.check .prompt.scenario{font-family:var(--serif);font-weight:400;color:var(--body);font-size:1.02rem;line-height:1.6;margin:0 0 .8rem}
.check .prompt.ask{margin:0 0 .9rem}
.opts{display:flex;flex-direction:column;gap:.55rem}
.opt{display:flex;gap:.8rem;align-items:flex-start;text-align:left;width:100%;background:var(--white);border:1.5px solid var(--border);border-radius:1rem;padding:.75rem .9rem;cursor:pointer;color:var(--body);font-family:var(--serif);font-size:1rem;line-height:1.5;transition:border-color .18s,background .18s}
.opt:hover:not(:disabled){border-color:var(--trust)}
.opt:disabled{cursor:default}
.opt .key{flex:0 0 auto;width:1.6rem;height:1.6rem;border-radius:50%;background:#E6E9EF;color:var(--header);font-family:var(--sans);font-size:.82rem;font-weight:500;display:grid;place-items:center;margin-top:.05rem}
.opt[data-picked="1"]{border-color:var(--header)}
.opt[data-picked="1"] .key{background:var(--header);color:#fff}
.opt[data-outcome="correct"]{border-color:var(--team);border-width:2px;background:#EAF3EF}
.opt[data-outcome="correct"] .key{background:var(--team);color:#fff}
.opt[data-outcome="wrong"]{border-color:var(--alert);border-width:2px;background:var(--alert-bg)}
.opt[data-outcome="wrong"] .key{background:var(--alert);color:#fff}
.opt[data-outcome="info"]{border-color:var(--tranquil)}
.opt[data-outcome="info"] .key{background:var(--tranquil)}
.opt[data-outcome="dim"]{opacity:.5}
.fb{border-radius:1rem;padding:.85rem 1.1rem;margin-top:.8rem;font-size:1rem}
.fb p{margin:0}
.fb p+p{margin-top:.7rem}
.fb .thread{margin:.7rem 0 0}
.fb .thread+p{margin-top:.7rem}
.fb.yes{background:#E4EFEA;border-left:.3rem solid var(--team);color:#1D4A40}
.fb.no{background:var(--alert-bg);border-left:.3rem solid var(--alert)}
.fb.info{background:#EAF4FA;border-left:.3rem solid #7FB4D4}
.fb .cards{margin:.7rem 0 0}
.fb .card{background:var(--white);border-color:#CFE5F2} .fb.info .head{color:#2C6C90}

/* ---------- transcripts ---------- */
.vig{border:1px solid var(--border);border-radius:1.4rem;padding:1.3rem 1.4rem;margin:1rem 0 0}
.vig-head{display:flex;align-items:center;gap:.8rem;margin:0 0 1rem;flex-wrap:wrap}
.avatar{width:2.6rem;height:2.6rem;border-radius:50%;background:var(--tranquil);display:grid;place-items:center;font-family:var(--sans);font-weight:500;color:var(--header)}
.vig-head .nm{font-family:var(--sans);font-size:1.1rem;color:var(--header);font-weight:500;display:block;line-height:1.2}
.vig-head .sub{font-family:var(--sans);font-size:.78rem;color:var(--taupe)}
.chip{font-family:var(--sans);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:500;padding:.35rem .8rem;border-radius:99px;background:var(--trust);color:var(--header)}
.chip.blue{background:var(--tranquil)}
.thread{background:var(--convo);border:1px solid var(--convo-line);border-radius:1.1rem;padding:1rem 1.15rem;margin:0 0 1rem}
.thread .ch{font-family:var(--sans);font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--taupe);font-weight:500;margin:0 0 .7rem}
.line{margin:0 0 .7rem}
.line:last-child{margin-bottom:0}
.line .spk{font-family:var(--sans);font-size:.78rem;font-weight:500;color:var(--header);display:block;margin-bottom:.15rem}
.line .meta{font-style:italic;color:var(--taupe)}
.bubble{max-width:88%;padding:.65rem .9rem;border-radius:1.1rem;margin:0 0 .45rem;font-size:1rem;line-height:1.55;position:relative;z-index:1}
.bubble.them{background:var(--white);border:1px solid var(--convo-line);border-bottom-left-radius:.35rem}
.bubble.us{background:var(--tranquil);border-bottom-right-radius:.35rem;margin-left:auto;color:var(--header)}
.bubble .spk{font-family:var(--sans);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--taupe);display:block;margin-bottom:.2rem}
.sysline{font-style:italic;color:var(--taupe);font-size:.95rem;margin:.2rem 0 .7rem;text-align:center}
/* An annotation hangs off the message it belongs to: same yellow as the
   highlight, tucked under the bubble, so it reads as part of that message
   rather than as the next one in the thread. */
.ann{display:none;max-width:88%;margin:-.55rem 0 .9rem auto;padding:.9rem .95rem .6rem;background:#FFF3C4;border:1px solid var(--trust);border-top:0;border-radius:0 0 .9rem .9rem;font-size:.95rem;line-height:1.5;color:var(--header);position:relative;z-index:0}
.ann .spk{color:#6B5A1E}
.ann.on{display:block}
.col p.indent{margin-left:1.6rem;padding-left:1rem;border-left:2px solid var(--border)}
mark{background:var(--trust);color:var(--header);padding:.05em .25em;border-radius:.3em;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone;border-bottom:2px solid rgba(34,34,34,.35);transition:background .15s}
mark:hover{filter:brightness(.95)}
mark.on{background:var(--header);color:var(--white);border-bottom-color:var(--header)}
mark:focus-visible{outline:2px solid var(--header);outline-offset:2px}
.ann .spk{font-family:var(--sans);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--taupe);display:block;margin-bottom:.2rem}
.col p a,.col li a,.col .note a{color:var(--header);text-decoration:underline;text-underline-offset:.15em}
.typing{display:inline-flex;gap:5px;padding:.7rem .9rem;background:var(--white);border:1px solid var(--convo-line);border-radius:1.1rem}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--taupe);opacity:.5;animation:blink 1.3s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}

<script>
/* =====================================================================
   9-8-8 e-learning prototype — MODULE CONTENT
   Key Responder Skills · Module 1: Preparing for Interactions
   Source storyboard: KRS_Module_1_Content_SME_Changes_Included.docx

   This file holds content only. All styling and interaction behaviour
   lives in shell.html. Build a deliverable with:
       python3 build.py module1_content.js
   ===================================================================== */

const META = {
  course:      'Key Responder Skills',
  moduleLabel: 'Module 1',
  title:       'Preparing for Interactions',
  time:        '30 minutes'
};

/* The storyboard supplies no completion copy for this module; this is
   carried forward from the previous build for the client to confirm. */
const END = {
  title:     `You have finished Module 1`,
  summary:   `You met seven callers and texters, tested your expectations against the research, and started building a personal set of strategies. They all return later in the course.`,
  nextTitle: `What comes next`,
  next:      `Module 2 practises meeting caution with patience and honest answers. Module 3 develops reflective practice, and takes your readiness reflection with it. Module 4 builds first responses into a full skill set.`
};

/* Sidebar / drawer page names. One entry per `sec` index used below.
   A string lists the page in the contents menu; {menu:false} keeps a
   continuation page out of it, so the menu reads as topics and activities. */
const SECTIONS = [
  'Welcome',
  'Topic 1: Preparing for the interaction',
  'Activity: What can you know from the first moments?',
  {name:'What can you know from the first moments: the message', menu:false},
  'Topic 2: How callers and texters present',
  'Activity: Who is reaching out?',
  {name:'Who is reaching out: the interactions', menu:false},
  'Topic 3: Understanding context',
  'Activity: What might be shaping this presentation?',
  {name:'What might be shaping this presentation: the presentations', menu:false},
  {name:'Topic 3: Understanding context, continued', menu:false},
  'Activity: Build a readiness plan',
  'Activity: Readiness reflection',
  'Live practice and references'
];

/* Every screen, in order. `sec` maps a screen to a page in SECTIONS. */
const SCREENS = [
{sec:0, type:'cover'},

{sec:0, type:'prose', title:'Module overview', blocks:[
  {p:`Every 9-8-8 interaction is unique. When an interaction begins, you may know very little about the person reaching out, what they are experiencing, or the support they need in that moment.`, lede:true},
  {p:`In this module, you will learn how to prepare for these interactions and how to work with the uncertainty they bring. Along the way, you will meet callers and texters whose experiences reflect the range of interactions you will encounter in your work. You will consider what each person may need in the opening moments of the interaction and select the best responses based on those needs.`},
  {p:`You will also:`},
  {cards:{cols:3, items:[
    {t:`Compare your expectations with research on caller and texter presentations`},
    {t:`Examine how social, cultural and structural circumstances shape distress and disclosure`},
    {t:`Explore ways to prepare for the demands of the work`}
  ]}},
  {p:`This foundation will help you adapt the skills taught in later modules to a diverse range of people and situations.`},
  {panel:{cls:'blue', p:`The callers and texters introduced here will return as you practise those skills throughout the course.`}},
  {note:`Estimated completion time: 30 minutes`}
]},

{sec:0, type:'prose', title:'Learning objectives', blocks:[
  {p:`By the end of this module, you will be able to:`, lede:true},
  {cards:{cols:1, num:true, items:[
    {t:`Describe the range of reasons people contact 9-8-8, from loneliness and emotional distress to suicidal crisis`},
    {t:`Explain why repeat contact is a normal part of the service`},
    {t:`Explain why uncertainty is a natural part of crisis line work and why working with it is a professional skill`},
    {t:`Identify how social, cultural, and structural circumstances can shape distress and disclosure`},
    {t:`Identify personal reactions that may arise during demanding interactions and strategies for managing them`}
  ]}}
]},

{sec:0, type:'prose', title:'Module topics', blocks:[
  {p:`Turn each card to see what the topic covers.`, lede:true},
  {flip:[
    {front:`Preparing for the interaction`, back:`How working with uncertainty can be developed as a professional skill.`},
    {front:`How callers and texters present`, back:`How the range of caller and texter needs and experiences may appear in your work.`},
    {front:`Understanding context`, back:`How social, cultural, and structural circumstances influence distress and disclosure.`}
  ]}
]},

/* ---------------- TOPIC 1 ---------------- */
{sec:1, type:'section', num:'01', kicker:'Topic 1', art:'a',
 title:`Preparing for the interaction`, line:`How working with uncertainty can be developed as a professional skill.`},

{sec:1, type:'prose', title:'What you cannot know in advance', blocks:[
  {p:`When you answer a 9-8-8 call or text, you usually know very little about the person. There is often no background information and no shared history to guide you. For many people, it may be the first and only time they contact the service.`, lede:true},
  {p:`During an interaction, it is the person who reaches out that decides what to share, when to share it, and where the conversation will go. As a result, there are <strong>many things you cannot predict</strong> in advance:`},
  {cards:{cols:3, items:[
    {t:`A person may begin with one concern and move toward something very different.`},
    {t:`The person may share very little information to guide the conversation.`},
    {t:`The interaction may end without you knowing how the person experienced it or what happened afterward.`}
  ]}},
  {key:[`This uncertainty is a <strong>natural part</strong> of crisis line work.`]}
]},

{sec:1, type:'prose', title:'What you do know', blocks:[
  {p:`At the same time, there is a lot that you do know. As a responder, you begin every interaction with:`, lede:true},
  {cards:{cols:2, items:[
    {t:`Your training, including the skills you will develop in this course`},
    {t:`A clear understanding of your role as a responder and its limits`},
    {t:`The 9-8-8 Suicide Assessment and Safety Planning (SASP) Model and the standard operating procedures`},
    {t:`A supervisor who is available to support you during your shift`}
  ]}},
  {p:`These are consistent resources you can draw on as you learn more about each caller or texter, consider what they need, and decide how to proceed in the interaction.`}
]},

{sec:1, type:'prose', title:'Working with uncertainty is a professional skill', blocks:[
  {p:`Not knowing how an interaction will go can feel uncomfortable. That discomfort is normal.`, lede:true},
  {p:`The good news is that the ability to handle uncertainty is not a personality trait that some responders naturally have and others do not. It is a <strong>professional skill</strong> that can be developed and strengthened through practice, reflection, and experience.`},
  {h3:`How does this skill develop?`},
  {p:`The starting point is <strong>self-awareness.</strong> This means noticing what happens within yourself when you do not know what is coming.`},
  {p:`Your reactions can provide useful information, but they should not determine how you respond.`},
  {h3:`Responders may experience:`},
  {reveal:{cta:`Reveal a common reaction`, more:`Reveal the next`, items:[
    `Sadness`,
    `Powerlessness`,
    `Surprise or shock`,
    `An urge to problem-solve or address the situation quickly`,
    `A desire to know how the interaction turned out`
  ]}},
  {panel:{cls:'blue', p:`These reactions do not mean that something has gone wrong. They are simply part of the work of a 9-8-8 responder. It's what you do with them that matters.`}}
]},

{sec:1, type:'prose', title:'What that looks like in practice', blocks:[
  {p:`In practice, developing this skill means:`, lede:true},
  {acc:[
    {q:`Setting realistic expectations of yourself`, a:`A lot of this discomfort comes from feeling that you need to resolve every situation or find out how it ends. Being clear about your role as a responder, and its limits, can make the uncertainty easier to handle.`},
    {q:`Allowing a moment to unfold`, a:`Long pauses, vague openings, or silence can be difficult to interpret. Part of developing this skill means learning to wait a little longer before stepping in.`},
    {q:`Reflecting after interactions`, a:`One way you can build the necessary self-awareness for this skill is by intentionally reflecting about how an interaction affected you and what shaped your responses.`},
    {q:`Using debriefing, supervision, and peer support`, a:`This skill can also be developed by talking through a nuanced or difficult interaction with supervisors and peers.`}
  ]},
  {p:`The more experience you have, the more natural this will become. As you encounter a wider range of interactions, fewer situations will feel entirely unfamiliar.`},
  {key:[`The uncertainty does not disappear, but you become better able to recognize your reactions and remain present without letting them take control.`]}
]},

/* ---------------- ACTIVITY: FIRST MOMENTS ---------------- */
{sec:2, type:'section', kicker:'Activity', art:'e', tone:'tranquil',
 title:`What can you know from the first moments?`, line:`One opening message, and what it does and does not tell you.`},

{sec:2, type:'prose', title:'How this activity works', blocks:[
  {p:`The first thing a person shares is often all you have to guide your initial response. It can quickly shape what you expect and what you say next. Working with uncertainty means noticing what those first words suggest and how you react to them, without treating those first impressions as facts.`, lede:true},
  {p:`In this activity, you will apply these ideas to an example. The example below is based on the kinds of interactions that 9-8-8 partner organizations have encountered in real life. As you read it, consider what the opening message tells you, what it might suggest, and what remains unknown.`},
  {note:`After you answer a question in this module, you can select the other options to read their feedback.`}
]},

{sec:3, type:'mcq', title:'The opening message',
 intro:[
  {thread:{ch:'Text', lines:[
    {who:'them', spk:'Texter', t:`I'm not suicidal. Is there a different number I should use for just bad thoughts?`}
  ]}}
 ],
 prompt:`Based only on this opening message, how would you expect the interaction to develop?`, hint:`Select the best answer.`,
 options:[
  {k:'A', t:`The interaction will probably remain focused on the difficult thoughts the texter mentioned, with suicide risk unlikely to become part of it.`, correct:false,
   fb:`The opening message gives you useful information, but it does not tell you everything. Settling too quickly on an interpretation can make important information easier to miss.`},
  {k:'B', t:`The interaction may take a different direction than what the first message suggests, particularly as trust begins to build.`, correct:true,
   fb:`The opening message matters, but it is only the beginning. Staying curious gives the texter space to share more information about what is happening.`},
  {k:'C', t:`The texter likely wants support for the difficult thoughts for now, then a referral to a more appropriate service later.`, correct:false,
   fb:`You do not yet know where the interaction will lead. Deciding too early that another service is more appropriate can narrow your understanding before you have enough information.`}
 ]},

{sec:3, type:'prose', title:'What happened next?', blocks:[
  {p:`As the conversation continued and trust developed, the texter shared:`, lede:true},
  {reveal:{cta:`Reveal what the texter shared`, more:`Reveal the next`, items:[
    `A long history of self-harm and a current urge to self-harm`,
    `A recent suicide attempt`,
    `A recent experience that had brought earlier trauma back to the surface`,
    `Suicide plans that they were not currently intending to act on`,
    `A recent change in their urges to self-harm that frightened them`
  ]}},
  {p:`None of this meant the texter's first message was inaccurate. When they wrote "I'm not suicidal," they meant it. There was simply more to understand.`},
  {p:`The fuller picture emerged over the course of the interaction because the responder did not assume that the first message told them everything they needed to know.`},
  {panel:{cls:'blue', p:`Working with uncertainty means resisting the pressure to decide too quickly on what an interaction is about or where it will lead. Instead, your job is to stay curious and allow the person to show you what they need as the interaction develops.`}}
]},

/* ---------------- TOPIC 2 ---------------- */
{sec:4, type:'section', num:'02', kicker:'Topic 2', art:'b',
 title:`How callers and texters present`, line:`How the range of caller and texter needs and experiences may appear in your work.`},

{sec:4, type:'prose', blocks:[
  {p:`Before we learn more about who reaches out to 9-8-8, let's start with a brief estimation activity. You will be presented with two questions about the statistics on who uses crisis services. Make your best guess from the options provided.`, lede:true},
  {note:`Your answers will not be scored. The purpose of this activity is to notice the expectations you may already bring into this work, and then compare them with what the research tells us about people who use crisis services.`}
]},

{sec:4, type:'mcq', title:'Estimate 1', shared:true, answerKey:'A',
 prompt:`Out of every 100 people who text a crisis service, how many do you think report thoughts of suicide?`, hint:`Make your best guess.`,
 options:[{k:'A', t:`About 20`},{k:'B', t:`About 50`},{k:'C', t:`About 80`}],
 sharedFb:`In the largest study of a text-based crisis service, about <strong>23 out of every 100</strong> texters reported thoughts of suicide. Suicidal thoughts are an important part of the work, but most texters in this study were experiencing other forms of distress.`},

{sec:4, type:'mcq', title:'Estimate 2', shared:true, answerKey:'C',
 prompt:`How common do you think it is for the same person to contact a crisis service more than once?`, hint:`Make your best guess.`,
 options:[{k:'A', t:`Rare`},{k:'B', t:`Fairly common`},{k:'C', t:`Very common`}],
 sharedFb:`Repeat contact is a <strong>very common</strong> part of crisis service work. Research shows that many people reach out more than once. For some, a crisis line is one part of a broader network of support for loneliness, significant mental health concerns, or suicide risk.`},

{sec:4, type:'prose', title:'What do these findings tell us?', blocks:[
  {p:`Taken together, these findings give us a better understanding of who reaches out to 9-8-8.`, lede:true},
  {ul:[
    `Some interactions involve suicidal thoughts or behaviour.`,
    `Many others involve significant distress without thoughts of suicide.`,
    `Some people will contact the service once, while others will return.`
  ]},
  {p:`The absence of suicidal thoughts does not mean that distress is mild. Many people contact a crisis service in significant emotional distress, whether or not suicide is part of what they share.`},
  {h3:`Across crisis services, common reasons for reaching out include:`},
  {cards:{cols:5, tight:true, items:[
    {t:`Loneliness`},{t:`Isolation`},{t:`Relationship problems`},{t:`Grief`},{t:`Family conflict`}
  ]}},
  {p:`If any of the findings differed from what you expected, take note of that gap. Your expectations about what an interaction is supposed to look like can shape what you pay attention to once it begins.`},
  {panel:{cls:'blue', p:`Keep these expectations in mind as you meet the callers and texters in this course.`}}
]},

{sec:4, type:'prose', title:'The range of people who contact 9-8-8', blocks:[
  {p:`Since 9-8-8 is a suicide prevention service, everyone who reaches out is offered support related to suicide assessment and safety planning. At the same time, no one is turned away just because their situation is not, or does not look like, a suicidal crisis.`, lede:true},
  {h3:`The range of interactions you will encounter is broad. A person contacting 9-8-8 may be:`},
  {reveal:{cta:`Reveal a reason someone may reach out`, more:`Reveal the next`, items:[
    `Experiencing a suicidal crisis`,
    `Living with loneliness, grief, abuse or the end of a relationship`,
    `Facing financial or housing stress`,
    `Worried about someone else`,
    `Frightened by thoughts of harming another person`
  ]}},
  {p:`Several of these concerns may appear in a single interaction, and the first concern a person describes may not be the one that becomes most important.`}
]},

{sec:4, type:'prose', title:'Being prepared for all interactions', blocks:[
  {p:`When preparing for the range of interactions you may encounter, it's important to keep in mind that <strong>a small number of people use 9-8-8 in ways that do not align with the <a href="https://988.ca/terms">9-8-8 Terms of Service</a>.</strong>`, lede:true},
  {p:`9-8-8 is committed to being a safe and respectful space for everyone, including responders. Language or behaviour that does not align with the Terms of Service can include:`},
  {ul:[
    `Sexually inappropriate behaviour, such as using the service for sexual gratification`,
    `Language that is discriminatory, racist, harassing, abusive, or threatening`,
    `Intentional disruption of the service, such as prank calls`
  ]},
  {p:`This is different from an expression of frustration, anger, or pain. A person in distress may raise their voice or use profanity, and this on its own is not a misuse of the service.`},
  {p:`Responders frequently identify sexually inappropriate behaviours as a source of stress. Being prepared for these types of interactions is part of understanding the realistic range of the work.`},
  {note:`Note: 9-8-8 aims to balance the needs of callers and texters with the wellbeing of responders. The steps to follow when someone uses inappropriate language or behaviour are set out in the standard operating procedures (SOPs). This includes what to do if you do not feel safe to continue, or if you are concerned about the person's level of risk. Your supervisor is always available to support you, and these procedures will be covered in future training.`}
]},

{sec:4, type:'prose', title:'Why this matters for your work', blocks:[
  {p:`Responder training often focuses on a single, familiar version of a crisis: a highly distressed person at risk of suicide.`, lede:true},
  {p:`Those interactions are important, but they are only one aspect of the work. Real interactions vary in urgency, tone, content, and need.`},
  {p:`The intensity of a person's emotions is also not a reliable measure of their suicide risk. A person may be sobbing, shouting, or struggling to speak but not thinking about suicide. They may have reached a point where they have no other outlet and are turning to 9-8-8 for support. You will learn more about responding to strong emotions in Module 6, and the steps for suicide risk assessment are covered in the SASP course.`},
  {h3:`If you expect a specific type of presentation on the lines:`},
  {cards:{cols:2, items:[
    {t:`You may find it harder to recognize other forms of distress.`},
    {t:`You may compare the person with an expected pattern, rather than understanding them on their own terms.`}
  ]}},
  {key:[`Preparing for the full range of interactions helps you respond to the person who has reached out.`]}
]},

/* ---------------- ACTIVITY: WHO IS REACHING OUT? ---------------- */
{sec:5, type:'section', kicker:'Activity', art:'c', tone:'tranquil',
 title:`Who is reaching out?`, line:`The opening moments of seven different 9-8-8 interactions.`},

{sec:5, type:'prose', title:'How this activity works', blocks:[
  {p:`In this activity, you will review the opening moments of seven different 9-8-8 interactions. Each person reflects a type of presentation you may encounter in this work.`, lede:true},
  {p:`The activity changes slightly from one interaction to the next. You will be asked to complete some or all of these steps:`},
  {ol:[
    `<strong>Consider what the person may need first:</strong> Select the best answer from the options, then review the feedback.`,
    `<strong>Write your own first response:</strong> Type the first message you would send before you see any options.`,
    `<strong>Choose how you might respond:</strong> Select the first thing you would say or send, then see how the person responds.`
  ]},
  {p:`Choosing a response is a preview of the skills you will develop in Module 4. It is not a test of proficiency, and your responses are not scored. The goal for now is to notice how different responses can shape what happens next. After you see how the person responds, the feedback will identify the strongest response and explain why. You can also select the other responses to see how the person would have reacted.`},
  {note:`Note: You do not need to apply any procedures or policies in this activity. Focus on who is reaching out and what they may need from the responder in the opening moments.`}
]},

{sec:6, type:'vignette', n:1, person:{name:'Dominique', init:'D', sub:'Voice', tag:'High distress without suicidal thoughts'},
 thread:{ch:'Voice call', lines:[
   {who:'them', spk:'Responder', t:`Hello, 9-8-8: Suicide Crisis Helpline.`},
   {who:'them', spk:'Caller', meta:`(tired, frustrated)`, t:`Hi. I don't even know if this is the kind of thing that you can help with. I'm not going to hurt myself or anything like that.`}
 ]},
 step1:{prompt:`What may Dominique need from the responder in these opening moments?`, hint:`Select the best answer.`, options:[
   {k:'A', t:`An empathic reflection of how tired and frustrated she sounds`, correct:false,
    fb:`Reflecting her tone could help, but Dominique first needs to know whether she has reached the right service.`},
   {k:'B', t:`Confirmation that she has reached the right place before anything else is explored`, correct:true,
    fb:`Answering Dominique's question directly lets her know she can continue. People in significant distress can contact 9-8-8 even when they are not thinking about suicide.`},
   {k:'C', t:`An open question inviting her to say more about what has been hardest lately`, correct:false,
    fb:`An open question may help next, but exploring before answering her question may leave Dominique unsure whether she should continue.`}
 ]},
 step2:{prompt:`Now choose the first thing you would say to Dominique.`, hint:`There is no score. Notice how each response affects what she does next.`, options:[
   {k:'A', t:`"It sounds like you've been carrying something heavy for a while. Can you tell me more about what's been going on lately?"`,
    reply:[{spk:'Caller', meta:`(hesitant)`, t:`I guess. But... is this really what this line is for, though? I don't want to take up space from someone who needs it more.`}]},
   {k:'B', t:`"It sounds like something's really weighing on you. Would it help if I pointed you to some resources that might fit your situation?"`,
    reply:[{spk:'Caller', meta:`(flat)`, t:`I've got plenty of pamphlets and phone numbers already. That's not really why I'm calling a crisis hotline...`}]},
   {k:'C', t:`"You're in the right place. This line is for all kinds of distress, and I'm glad you called. Where would you like to start?"`,
    reply:[{spk:'Caller', meta:`(exhales slowly)`, t:`Okay. Thank you. I honestly didn't know if I should call. It's my disability benefits. They've had my claim under review for months, and there's a meeting coming up. It's like they've already decided I'm making it up. I haven't been sleeping. Last night I was just sitting in the kitchen at three in the morning, wide awake, going in circles.`}]}
 ],
 closing:`Dominique's immediate question is whether she should be calling 9-8-8 at all. The strongest response is the one that confirms she is in the right place. Once she knows she is welcome, Dominique can settle into the interaction and say more. An empathic reflection leaves her question unanswered, while offering resources addresses a need she has not raised.`}
},

{sec:6, type:'vignette', n:2, person:{name:'Riley', init:'R', sub:'Text', tag:'A texter who is quiet and slow to engage'},
 thread:{ch:'Text', lines:[
   {who:'us', spk:'Responder', t:`Welcome to 9-8-8: Suicide Crisis Helpline. What has you reaching out today?`},
   {who:'them', spk:'Texter', t:`hi`},
   {who:'them', spk:'Texter', t:`idk what i'm supposed to say`},
   {sys:`a long pause; the typing indicator appears, then stops`, typing:true}
 ]},
 write:{prompt:`Before you see any options, try writing the first message you would send to Riley.`,
  placeholder:`What would you send?`, cta:`Save my response`, best:'A',
  feedback:`Keep your message in mind as you review the options below. Notice which option is closest to what you wrote, and how Riley responds to it.`},
 step2:{prompt:`Now choose the first message you would send to Riley.`, hint:`There is no score. Notice how each response affects what they do next.`, options:[
   {k:'A', t:`"Hi, I'm glad you texted. There's no pressure to know what to say yet. I'm here, and we can go at your pace."`,
    reply:[{sys:`two minutes pass`},{spk:'Texter', t:`ok`},{spk:'Texter', t:`it's been a weird week i guess`},{sys:`the thread stays open`}]},
   {k:'B', t:`"Hi, thanks for reaching out. Can you tell me a bit about what's going on today? What made you decide to text?"`,
    reply:[{sys:`the typing indicator appears, stops, and does not return for several minutes`}]},
   {k:'C', t:`"Hi, you've reached 9-8-8. Lots of people aren't sure what to say at first. Is it something at school, at home, or something else?"`,
    reply:[{spk:'Texter', t:`idk`},{sys:`nothing further arrives for a long time`}]}
 ],
 closing:`Riley's typing indicator suggests they are still deciding whether to continue. The strongest response is the warm welcome that does not ask for an answer, because it gives Riley room to reply at their own pace. The other two responses ask Riley a question before they seem ready. Even a gentle question, or a second message sent too soon, can create pressure to respond. In a hesitant text interaction, time can matter just as much as words.`}
},

{sec:6, type:'vignette', n:3, person:{name:'Sam', init:'S', sub:'Voice', tag:'A caller presenting with anger'},
 thread:{ch:'Voice call', lines:[
   {who:'them', spk:'Responder', t:`Hello, 9-8-8: Suicide Crisis Helpline.`},
   {who:'them', spk:'Caller', meta:`(fast, loud)`, t:`Yeah, hi. So what's the script tonight? Because I've heard them all. I've been calling these help numbers for weeks, and every single one reads me the same lines. I lost my job and my housing in the same month. The same month. So go ahead. Tell me to take a deep breath.`}
 ]},
 step1:{prompt:`What may Sam need from the responder in these opening moments?`, hint:`Select the best answer.`, options:[
   {k:'A', t:`Acknowledgement of the losses, followed by a gentle transition toward what might help tonight`, correct:false,
    fb:`Acknowledging the losses is important, but moving quickly to what might help risks repeating the pattern Sam is describing. He first needs to know the responder has heard what happened.`},
   {k:'B', t:`Naming the anger directly and inviting Sam to say more about it`, correct:false,
    fb:`Naming the emotion can help, but Sam has been clear about what is driving his anger. Start with what happened rather than making the emotion the focus.`},
   {k:'C', t:`A sincere and calm acknowledgement of what the past several weeks have been like`, correct:true,
    fb:`Sam expects another script. Calmly acknowledging the job loss, the housing loss and the weeks of scripted responses shows that the responder has heard the substance of what he said. Other feelings may emerge once he feels heard.`}
 ]},
 step2:{prompt:`Now choose the first thing you would say to Sam.`, hint:`There is no score. Notice how each response affects what he does next.`, options:[
   {k:'A', t:`"You lost your job and your housing in the same month, and every place you've called has given you the same lines. That sounds exhausting."`,
    reply:[{spk:'Caller', meta:`(a beat)`, t:`...Yeah. The same month.`},
           {spk:'Caller', meta:`(slower)`, t:`And every landlord wants three months of pay stubs. With what job? Everyone I call acts like I'm the problem. You're the first one who's said it back to me straight.`}]},
   {k:'B', t:`"Okay. I can hear how upset you are. Let's slow things down a little. Take a breath, and start from the beginning for me."`,
    reply:[{spk:'Caller', meta:`(sharper)`, t:`Take a breath. There it is. You people must get that off a laminated card.`}]},
   {k:'C', t:`"I'm not going to read you a script, I promise. I'm here to help. So tell me, what do you need from me tonight?"`,
    reply:[{spk:'Caller', meta:`(guarded)`, t:`What I need. If I knew that, I wouldn't be calling a stranger at midnight, would I.`}]}
 ],
 closing:`Sam expects another script. The strongest response is the one that mirrors what he has told you about the job, the housing, and the ongoing calls. It shows that you have listened, and his anger begins to soften. Telling him to slow down confirms what he expects to hear, while asking what he needs moves too quickly toward a solution.`}
},

{sec:6, type:'vignette', n:4, person:{name:'Walter', init:'W', sub:'Voice', tag:'A caller who is lonely and contacts the line regularly'},
 thread:{ch:'Voice call', lines:[
   {who:'them', spk:'Responder', t:`Hello, 9-8-8: Suicide Crisis Helpline.`},
   {who:'them', spk:'Caller', meta:`(warm, leisurely)`, t:`Oh, hello. It's Walter. I expect I've spoken with some of your colleagues before, I call most weeks. In the evenings, mostly. The house gets very quiet around this hour. Margaret used to have the radio on while she made tea, and, well... I thought I'd rather talk to a person tonight than sit with the quiet.`}
 ]},
 step2:{prompt:`Choose the first thing you would say to Walter.`, hint:`There is no score. Notice how each response affects what he does next.`, options:[
   {k:'A', t:`"Thanks for calling, Walter. It's a busy night, so let's focus. What's the main thing you'd like to talk about?"`,
    reply:[{spk:'Caller', meta:`(a small pause)`, t:`Oh. Well. Nothing urgent, I suppose.`},
           {spk:'Caller', meta:`(more formal now)`, t:`I don't want to keep you if it's a busy night.`}]},
   {k:'B', t:`"It's good to hear from you, Walter. Those quiet evenings can feel long. What's been on your mind today?"`,
    reply:[{spk:'Caller', meta:`(settles in, warmer)`, t:`They can, they can. Well. I had a letter from my granddaughter today, actually. Margaret would have loved it. She's studying out west now, my granddaughter, and she writes the way Margaret used to...`}]},
   {k:'C', t:`"Hello, Walter. Have you thought about a seniors' program or a phone-visiting service for the evenings? It might help with the quiet."`,
    reply:[{spk:'Caller', meta:`(polite, flatter)`, t:`I've got the pamphlets somewhere, I'm sure.`},
           {spk:'Caller', meta:`(pause)`, t:`Well. Perhaps I'm keeping you.`}]}
 ],
 closingBlocks:[
   {p:`Walter has explained why he called. He would rather talk to a person tonight than sit alone with the quiet. The strongest response is a warm welcome that lets him decide where the conversation goes, which gives him the space to share more. The other responses suggest that he should have something more urgent to discuss or that he should find another service, and he begins to withdraw.`},
   {p:`Although Walter calls most weeks, you have no shared history or record of those conversations, so each call is a new conversation for you. Repeat contact does not make his need less legitimate.`}
 ]}
},

{sec:6, type:'vignette', n:5, person:{name:'Maya', init:'M', sub:'Text', tag:'A third-party interaction'},
 thread:{ch:'Text', lines:[
   {who:'us', spk:'Responder', t:`Welcome to 9-8-8: Suicide Crisis Helpline. What has you reaching out today?`},
   {who:'them', spk:'Texter', t:`Hey, sorry if this isn't even the right place to text this 😭 I'm not actually texting about me. I'm kind of worried about my roommate. She's barely left her room in like 2 weeks, she isn't answering any of my messages, and she's been skipping all her classes too. Is it okay that I'm texting you about someone else?? I honestly don't know what I'm supposed to do`}
 ]},
 write:{prompt:`Before you see any options, try writing the first message you would send to Maya.`,
  placeholder:`What would you send?`, cta:`Save my response`, best:'C',
  feedback:`Keep your message in mind as you review the options below. Notice which option is closest to what you wrote, and how Maya responds to it.`},
 step2:{prompt:`Now choose the first message you would send to Maya.`, hint:`There is no score. Notice how each response affects what she does next.`, options:[
   {k:'A', t:`"Thanks for reaching out. Can you tell me more about your roommate? How long has this been going on, and has she said anything about how she's feeling?"`,
    reply:[{spk:'Texter', t:`Um, two weeks ish? She hasn't really said anything, that's kind of the problem`},{spk:'Texter', t:`Sorry, was it wrong that I texted instead of her?`}]},
   {k:'B', t:`"That sounds hard. The most helpful thing is often for the person to contact us themselves. Do you think your roommate would be open to texting this line?"`,
    reply:[{spk:'Texter', t:`I mean maybe? She's not answering me at all though`},{spk:'Texter', t:`Sorry, I just didn't know where else to ask`}]},
   {k:'C', t:`"Yes, it's absolutely okay to text about someone else. You're in the right place. It sounds like a worrying two weeks, and we can think it through together."`,
    reply:[{spk:'Texter', t:`Okay, thank you, that's honestly a relief`},{spk:'Texter', t:`I've been second guessing whether I'm overreacting. So what should I be doing? I have so many questions`}]}
 ],
 closing:`Maya first needs to know that she can reach out about someone else. The strongest response is the one that answers her question directly and acknowledges how worrying the past two weeks have been for her. Third-party interactions are part of 9-8-8. Once Maya has her answer that she's reached the right place, she stops apologizing and begins asking for help. The other responses shift to her roommate too quickly and leave her question unanswered.`}
},

{sec:6, type:'vignette', n:6, person:{name:'Marc', init:'M', sub:'Voice', tag:'Thoughts of harming someone else'},
 thread:{ch:'Voice call', lines:[
   {who:'them', spk:'Responder', t:`Hello, 9-8-8: Suicide Crisis Helpline.`},
   {who:'them', spk:'Caller', meta:`(quiet, halting)`, t:`Hi. Um. I've never called anything like this before. (pause) I want to say something first. It's not about hurting myself. It's these thoughts I've been having about someone. Someone from my old job. (pause) I don't know if I'm even allowed to talk about that here. The thoughts are scaring me. That's why I called.`}
 ]},
 step1:{prompt:`What may Marc need from the responder in these opening moments?`, hint:`Select the best answer.`, options:[
   {k:'A', t:`Reassurance that intrusive thoughts are common and rarely mean a person will act`, correct:false,
    fb:`You do not yet know what Marc is describing. Reassurance could minimize what frightened him and make it harder to continue.`},
   {k:'B', t:`Gentle, specific questions about the thoughts to understand what he is describing`, correct:false,
    fb:`Understanding the thoughts will be important, but detailed questions may feel like the reaction Marc fears. First, he needs to know he can talk about this here.`},
   {k:'C', t:`A steady, clear response that lets him know he can talk about it here`, correct:true,
    fb:`Marc is testing whether it is safe to say more. A calm, non-judgmental response answers that question without alarm. The SASP course and standard operating procedures cover the next steps, including how to address risk to others.`}
 ]},
 step2:{prompt:`Now choose the first thing you would say to Marc.`, hint:`There is no score. Notice how each response affects what he does next.`, options:[
   {k:'A', t:`"It's normal to have upsetting thoughts sometimes. They usually pass. What's been going on?"`,
    reply:[{spk:'Caller', meta:`(quiet)`, t:`Right. Normal. (pause) They don't feel normal.`},
           {spk:'Caller', meta:`(flatter)`, t:`Maybe this was a mistake.`}]},
   {k:'B', t:`"You're allowed to talk about that here. I'm glad you called. Take whatever time you need."`,
    reply:[{spk:'Caller', meta:`(long exhale)`, t:`Okay. (pause) Okay. I wasn't sure anyone would say that.`},
           {spk:'Caller', meta:`(still halting, but continuing)`, t:`It started after they let me go. I was so angry at him. Some days I still think I've got a right to be. It's where the thoughts go after that part. That's what scares me.`}]},
   {k:'C', t:`"I hear you. Before you say more, I should explain a few things about how this call works."`,
    reply:[{spk:'Caller', meta:`(wary)`, t:`How the call works. (pause) What do you mean? Is something going to happen if I tell you?`}]}
 ],
 closing:`Marc is asking whether he can say this here at all. The strongest response is the calm, clear yes, which gives him room to continue. Trying to reassure him minimizes what is frightening him, while explaining how the call works sounds like the alarm he expects. The SASP course and standard operating procedures cover what you should do next.`}
},

{sec:6, type:'vignette', n:7, person:{name:'Jae', init:'J', sub:'Text', tag:'A person in acute crisis'},
 thread:{ch:'Text', lines:[
   {who:'us', spk:'Responder', t:`Welcome to 9-8-8: Suicide Crisis Helpline. What has you reaching out today?`},
   {who:'them', spk:'Texter', t:`i can't do this`},
   {who:'them', spk:'Texter', t:`my relationship ended this week and i can't stop crying`},
   {who:'them', spk:'Texter', t:`i keep thinking about killing myself`},
   {who:'them', spk:'Texter', t:`i don't know what to do`},
   {sys:`the four messages arrive within seconds of each other`}
 ]},
 step1:{prompt:`What may Jae need from the responder in these opening moments?`, hint:`Select the best answer.`, options:[
   {k:'A', t:`A caring reflection that brings together the breakup, the crying, and the thoughts of suicide`, correct:false,
    fb:`Reflection matters, but a long response may be hard to process when messages are arriving this quickly. Jae needs something brief enough to meet the urgency.`},
   {k:'B', t:`A brief, clear message that responds directly to the most urgent thing Jae has said`, correct:true,
    fb:`Jae has said directly that they are thinking about suicide. A brief, clear response shows that you have heard this and are present. The rapid, fragmented messages also indicate the level of distress. The next steps, including suicide risk assessment, should follow the SASP Model.`},
   {k:'C', t:`A quick supportive message, followed by a question about what has helped during difficult moments before`, correct:false,
    fb:`That question may help later. First, you need to meet what Jae has said directly and establish a sense of presence.`}
 ]},
 step2:{prompt:`Now choose the first message you would send to Jae.`, hint:`There is no score. Notice how each response affects what they do next.`, options:[
   {k:'A', t:`"I'm here with you, and I'm glad you texted. You said you're thinking about killing yourself, and I want us to stay with that together. You're not alone right now."`,
    reply:[{sys:`the reply pattern slows`},{spk:'Texter', t:`ok`},{spk:'Texter', t:`i'm here`}]},
   {k:'B', t:`"I'm so sorry about your relationship. Breakups are one of the hardest things we go through, and crying is a completely natural response. It makes sense that you don't know what to do. Can you tell me more about what happened between you two?"`,
    reply:[{spk:'Texter', t:`idk`},{spk:'Texter', t:`it's not really about the breakup`},{spk:'Texter', t:`i said i keep thinking about killing myself`},{sys:`the messages keep arriving in bursts`}]},
   {k:'C', t:`"Thank you for reaching out tonight. You've come to the right place, and I'm here to listen. How are you feeling right now?"`,
    reply:[{spk:'Texter', t:`i don't know`},{spk:'Texter', t:`bad`},{spk:'Texter', t:`i don't know what to do`},{sys:`the burst pattern continues`}]}
 ],
 closing:`Jae has told you directly that they are thinking about suicide. The strongest response is the one that says this back to them clearly and calmly, and lets Jae know you are there. With a response like this, the pace of the messages begins to stabilize. The other responses focus on the breakup or ask Jae to repeat what they have already said. The SASP course covers suicide risk assessment and response in full.`}
},

{sec:6, type:'prose', title:'Activity debrief', blocks:[
  {p:`These interactions show how differently people may present and what they may need in the opening moments. They also show how a responder's first words can shape what happens next.`, lede:true},
  {key:[`The tricky part of this work is that no single response can meet every person's needs. Since you cannot know which needs the next interaction will bring, it is important to remain adaptable. Working with that uncertainty is part of your job as a responder.`]},
  {note:`Note: these callers and texters will return throughout the course. In future modules, you will revisit these opening moments and develop the skills used in these first responses more fully.`}
]},

/* ---------------- TOPIC 3 ---------------- */
{sec:7, type:'section', num:'03', kicker:'Topic 3', art:'d',
 title:`Understanding context`, line:`How social, cultural, and structural circumstances influence distress and disclosure.`},

{sec:7, type:'prose', blocks:[
  {p:`People do not experience or express distress in the same way. Identity, social position and life circumstances shape what distress looks and sounds like, and whether someone feels able to discuss it in the first place.`, lede:true},
  {p:`Suicide risk is also shaped by the social determinants of health, and some populations face greater risk than others. People experiencing similar levels of distress may still present very differently.`},
  {panel:{cls:'grey', h:'For example', p:`Some men may communicate suicidal distress through anger or physical concerns, rather than direct statements about how they feel.`}},
  {key:[`There is no single way that a person in crisis sounds. If you expect distress to follow a familiar pattern, you may miss what is being communicated by someone whose experience does not fit that pattern.`]}
]},

{sec:7, type:'prose', title:"How can we understand someone's context?", blocks:[
  {p:`There are two related forms of influence that help us understand a person's context.`, lede:true},
  {tabs:[
    {label:`Social determinants`, h:`Social determinants`, p:`The conditions in which people live, including income, housing, education, employment, and social connection.`},
    {label:`Structural determinants`, h:`Structural determinants`, p:`The policies, institutional arrangements, and written or unwritten rules that create and sustain patterns of advantage and disadvantage between groups.`}
  ]},
  {p:`Racism, discrimination against 2SLGBTQIA+ people, and other forms of oppression can cause harm in daily life and within the institutions people approach for help. Past discrimination may also reduce trust in services and shape whether, when and how much someone feels able to disclose.`},
  {panel:{cls:'blue', p:`It's important to remember that context is not always just background information. Discrimination, isolation, financial precarity, or unsafe living conditions may be central to someone's crisis.`}},
  {key:[`Recognizing these experiences as potential sources of distress is part of understanding a person's situation more fully.`]}
]},

{sec:7, type:'prose', title:'You are also part of the interaction', blocks:[
  {p:`Every interaction includes another source of context: the responder.`, lede:true},
  {p:`Your own social and cultural position shapes what you notice, the meaning you assign to what you hear, and how you respond.`},
  {note:`In Module 3, you will explore in detail the reflective practice needed to work with this awareness. For now, remember that every interaction is shaped by the contexts of two people, not one.`}
]},

/* ---------------- ACTIVITY: SHAPING THE PRESENTATION ---------------- */
{sec:8, type:'section', kicker:'Activity', art:'b', tone:'tranquil',
 title:`What might be shaping this presentation?`, line:`Four caller and texter presentations, and the circumstances that may be shaping each one.`},

{sec:8, type:'prose', title:'How this activity works', blocks:[
  {p:`The same distress can look and sound very different from one person to another.`, lede:true},
  {p:`In this activity, you will review a series of caller and texter presentations. For each one, select the explanation that you think is most important to stay curious about. More than one explanation could be true.`},
  {p:`Before you look at the options for each presentation, take a moment to think of two or three explanations that could be true.`},
  {note:`Note: the word "may" matters. These are possibilities to remain curious about, not conclusions to reach on someone else's behalf.`}
]},

{sec:9, type:'mcq', title:'Presentation 1',
 prompt:`A caller in his fifties describes chest tightness, poor sleep and a short temper. When the responder asks how he has been feeling, he says he is "not much of a talker" and almost ends the call.`, ask:`What might be shaping how this caller's distress presents?`, hint:`Select the best answer.`,
 options:[
  {k:'A', t:`He has a preference for privacy and handling difficult situations on his own`, correct:false,
   fb:`The caller may value privacy, but assuming that he wants to manage alone could close off the conversation. His physical concerns and irritability may be a way for him to express his distress.`},
  {k:'B', t:`He may express his distress through irritability and physical concerns, rather than direct statements`, correct:true,
   fb:`Some men communicate serious distress, including suicidal distress, through anger, irritability or physical concerns rather than direct statements about feelings. This does not establish what is happening, but it is a reason to remain patient and let the caller express himself in his own way.`},
  {k:'C', t:`He is ambivalent about receiving support`, correct:false,
   fb:`Almost ending the call is worth noticing, but reluctance to discuss feelings is not the same as unwillingness to accept support. He has remained on the line, creating an opportunity to continue gently.`}
 ]},

{sec:9, type:'mcq', title:'Presentation 2',
 prompt:`A texter takes a long time to share anything personal and asks twice about what will happen with the information they provide.`, ask:`What might be shaping how this texter engages with the service?`, hint:`Select the best answer.`,
 options:[
  {k:'A', t:`They are slower and more cautious because they are texting`, correct:false,
   fb:`The texter has asked twice what will happen with their information. Address that concern directly rather than attributing it to the fact that they are texting.`},
  {k:'B', t:`They are unfamiliar with how 9-8-8 works`, correct:false,
   fb:`Unfamiliarity may be a factor, but the repeated question suggests a broader concern about whether it is safe to disclose.`},
  {k:'C', t:`They may be cautious based on past experiences`, correct:true,
   fb:`Racism, discrimination, dismissal or other institutional harms can make caution a reasonable form of self-protection. Do not assume this is the texter's history. Support trust by answering honestly, explaining what happens with their information and avoiding pressure to disclose. You will practise this in Module 2.`}
 ]},

{sec:9, type:'mcq', title:'Presentation 3',
 prompt:`When describing their distress, a caller keeps returning to issues around money. Rent is overdue, an eviction notice has arrived, and they are struggling to show up to their shifts at work.`, ask:`What might be shaping this caller's distress?`, hint:`Select the best answer.`,
 options:[
  {k:'A', t:`Financial precarity`, correct:true,
   fb:`Social and structural conditions can be the substance of a crisis, not background information. The overdue rent and threat of eviction are central to this caller's experience. Taking the fear and exhaustion seriously is an important form of validation.`},
  {k:'B', t:`Discomfort discussing feelings explicitly`, correct:false,
   fb:`Feelings and finances may be connected, but treating money as a symptom rather than a cause directs the caller away from the crisis as they experience it. The financial situation is the crisis.`},
  {k:'C', t:`A need for practical guidance`, correct:false,
   fb:`Practical resources may eventually help, but moving immediately to referrals or problem-solving may leave the caller's fear and distress unheard.`}
 ]},

{sec:9, type:'mcq', title:'Presentation 4',
 prompt:`An older caller who lives alone in a rural community calls most weeks, usually in the evening.`, ask:`What might be shaping this pattern of contact?`, hint:`Select the best answer.`,
 options:[
  {k:'A', t:`The caller misunderstands the service's purpose and has become dependent on responders in place of other relationships`, correct:false,
   fb:`Regular contact does not constitute misuse or dependence. Start with curiosity about what the calls provide and why the accessibility of a crisis line is important.`},
  {k:'B', t:`The caller prefers telephone support over building connections in their community`, correct:false,
   fb:`Telephone support may be a preference, but rural communities may also have limited services, long travel distances and few transportation options.`},
  {k:'C', t:`The caller is socially isolated and likely has limited access to services in the area`, correct:true,
   fb:`Local supports may be limited or difficult to reach, and telephone support may be the most accessible way to connect. Repeat contact is normal, and 9-8-8 may be a meaningful part of this caller's support network.`}
 ]},

/* ---------- blocks ---------- */
function blocks(list, root){
  list.forEach(b=>{
    if(b.p) root.append(el('p', [b.lede?'lede':'', b.indent?'indent':''].join(' ').trim()||null, H(b.p)));
    else if(b.h3) root.append(el('h3', null, H(b.h3)));
    else if(b.ul){ const u=el('ul','brand'); b.ul.forEach(t=>u.append(el('li',null,H(t)))); root.append(u); }
    else if(b.ol){ const o=el('ol','brand'); b.ol.forEach(t=>o.append(el('li',null,H(t)))); root.append(o); }
    else if(b.panel) root.append(el('div','panel '+(b.panel.cls||''), (b.panel.h?'<h4>'+b.panel.h+'</h4>':'')+'<p>'+H(b.panel.p)+'</p>'));
    else if(b.note) root.append(el('div','note','<p>'+H(b.note)+'</p>'));
    else if(b.key) root.append(el('div','keycall', b.key.map(t=>'<p>'+H(t)+'</p>').join('')));
    else if(b.cards) root.append(cardsEl(b.cards));
    else if(b.flip) root.append(flipEl(b.flip));
    else if(b.tabs) root.append(tabsEl(b.tabs, b.select));
    else if(b.acc) root.append(accEl(b.acc));
    else if(b.reveal) root.append(revealEl(b.reveal));
    else if(b.table) root.append(tableEl(b.table));
    else if(b.thread) root.append(threadEl(b.thread));
    else if(b.audio) root.append(audioEl({label:b.audio.label, open:b.audio.open,
      transcript: threadEl({ch:b.audio.ch||'Voice call', lines:b.audio.lines})}));
  });
}
function cardsEl(c){
  const d=el('div','cards'+(c.tight?' tight':'')+(c.num?' numbered':'')); d.dataset.cols=c.cols||3;
  c.items.forEach((i,ix)=>d.append(el('div','card',
    (c.num?'<span class="mk">'+String(ix+1).padStart(2,'0')+'</span>':'<span class="mk dot"></span>')+'<span>'+H(i.t)+'</span>')));
  return d;
}
function flipEl(items){
  const d=el('div','flips');
  /* Sets of two or four sit in two columns so no card is orphaned on its own row. */
  if(items.length%3!==0 && items.length%2===0) d.dataset.cols='2';

    const c=el('div','flip','<button class="inner" aria-pressed="false">'+
      '<span class="face f"><span class="n">'+String(ix+1).padStart(2,'0')+'</span><span class="t">'+H(i.front)+'</span><span class="hint">Tap to turn</span></span>'+
      '<span class="face b"><span class="hint">'+H(i.front)+'</span><p>'+H(i.back)+'</p><span class="hint">Tap to turn back</span></span></button>');

    btn.onclick=()=>{ c.classList.toggle('on'); btn.setAttribute('aria-pressed', c.classList.contains('on')); };
    d.append(c);
  });

}
function tabsEl(items, sel){
  const d=el('div','tabs'), list=el('div','tablist'), panel=el('div','tabpanel');
  /* `select` opens the tab that the learner's earlier answers call for:
     {ids:['q1','q2'], same:1, diff:0} compares the picks recorded for those
     question ids. With any of them unanswered the first tab opens. */
  let first=0;
  if(sel && sel.ids && sel.ids.every(id=>state.picks[id]!=null)){
    const ks=sel.ids.map(id=>state.picks[id]);
    first = ks.every(k=>k===ks[0]) ? (sel.same??0) : (sel.diff??0);
  }
  list.setAttribute('role','tablist'); panel.setAttribute('role','tabpanel');
  const show=n=>{ [...list.children].forEach((b,i)=>b.setAttribute('aria-selected', i===n));
    const it=items[n]; panel.innerHTML=(it.h?'<h4>'+H(it.h)+'</h4>':'')+'<p>'+H(it.p)+'</p>'; };
  items.forEach((it,i)=>{ const b=el('button',null,it.label); b.setAttribute('role','tab'); b.onclick=()=>show(i); list.append(b); });
  d.append(list,panel); show(first); return d;
}

function lineEl(l, isText){
  if(l.sys){
    const wrap=el('div');
    if(l.typing) wrap.append(el('div','typing','<i></i><i></i><i></i>'));
    wrap.append(el('p','sysline','('+l.sys+')'));
    return wrap;
  }
  const node = isText
    ? el('div','bubble '+(l.who==='us'?'us':'them'),'<span class="spk">'+(l.spk||'')+'</span>'+H(l.t))
    : el('div','line','<span class="spk">'+(l.spk||'')+'</span>'+(l.meta?'<span class="meta">'+l.meta+' </span>':'')+H(l.t));
  if(!l.ann) return node;
  /* Annotations sit under their line, hidden to start. Each <mark> in the
     line toggles its own annotation (the nth mark opens the nth one); a line
     with no marks is revealed by a `write` screen with `annotate:true`. */
  const anns=[].concat(l.ann), labels=[].concat(l.annLabel||'Annotation');
  const wrap=el('div'); wrap.append(node);
  const boxes=anns.map((a,i)=>{ const b=el('div','ann',
    (labels[i%labels.length]?'<span class="spk">'+labels[i%labels.length]+'</span>':'')+H(a)); wrap.append(b); return b; });
  node.querySelectorAll('mark').forEach((m,i)=>{
    const box=boxes[Math.min(i,boxes.length-1)];
    m.setAttribute('role','button'); m.tabIndex=0; m.setAttribute('aria-expanded','false');
    const flip=()=>{ const on=box.classList.toggle('on'); m.classList.toggle('on',on); m.setAttribute('aria-expanded',on); };
    m.onclick=flip; m.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); } };
  });
